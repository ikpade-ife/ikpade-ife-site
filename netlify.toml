[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

# La page 404.html personnalisée est servie automatiquement par Netlify
# pour toute route introuvable — aucune redirection supplémentaire n'est
# nécessaire pour l'instant (le site n'a pas encore de routage par URL).
# Redirections : les anciennes adresses en .html mènent à l'adresse propre (301 = définitive,
# "force" car le fichier .html existe réellement et Netlify le servirait sinon).

[[redirects]]
  from = "/blog.html"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/blog/role-tuteur-wali-mariage-islamique.html"
  to = "/blog/role-tuteur-wali-mariage-islamique"
  status = 301
  force = true

